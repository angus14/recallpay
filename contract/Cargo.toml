[package]
name = "recallpay"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.24.1", features = ["legacy"] }
near-sys = "=0.2.7"
borsh = "=1.5.7"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
